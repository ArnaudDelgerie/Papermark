# Enable stateless CSRF protection for forms and logins/logouts
framework:
    form:
        csrf_protection:
            token_id: submit
            # No JS double-submit on forms: once a session used it, Symfony rejects
            # requests without it, and the editor's fetch calls rely on the origin check.
            field_attr: []

    csrf_protection:
        stateless_token_ids:
            - submit
            - authenticate
            - logout
            - upload
            - file
            - ai
            - settings
